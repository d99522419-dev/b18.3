{% extends "base.html" %}

{% block main %}
<h1>Редактировать студента</h1>

<form method="post" enctype="multipart/form-data">
{%csrf_token%}
<p>
    <label for="name">Имя:</label>
        <input type="text" id="name" name="first_name" value="{{student.first_name}}">
    </p>
    <p>
    <label for="last_name">Фамилия:</label>
        <input type="text" id="last_name" name="last_name" value="{{student.last_name}}">
    </p>
    <p>
        <label for="age">Возраст:</label>
        <input type="number" id="age" name="age" value="{{student.age}}">
    </p>
    <p>
        <label for="phone">Номер Телефона:</label>
        <input type="text" id="phone" name="phone_number" value="{{student.phone_number}}">
    </p>
    <p>
        <label for="parent_phone">Номер телефона родителя:</label>
        <input type="text" id="parent_phone" name="parent_phone_number" value="{{student.parent_phone_number}}">
    </p>
    <p>
    <label for="Группа">Группа:</label>
    <select name="group" required>
        <option value="">--Выберите группу--</option>                                       
        {% for group in groups %}
            <option value="{{ group.id }}"
        </option>
        {% endfor %}
    </select>
    </p>
    <p>
    <label for="avatar">Аватар:</label>
    {% if student.avatar %}
        <img src="{{ student.avatar.url }}" alt="{{ student.first_name }}">
        <small>Загрузите новую если хотите заменить</small>
    {% endif %}
    <input type="file" name="avatar">
    </p>
    <button type="submit">Сохранить</button>
</form>
<a href="{% url 'main' %}">Назад</a>

{% endblock  %}
